<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>worktrace</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body data-theme="dark">
    <header class="topbar">
      <div class="titlebar-drag topbar__brand">
        <div class="topbar__mark" aria-hidden="true">
          <svg class="topbar__icon" viewBox="0 0 300 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CGI">
            <title>CGI</title>
            <g id="Layer_1">
              <g>
                <path fill="#e3262d" d="M74.8,27c-27.4,0-44.2,21.4-44.2,43c0,26,21.2,43,44.4,43c15.4,0,30-6.8,42.4-17.8v32.2
      c-13,7.8-30.8,12.6-44.6,12.6C33.2,140,0,107.8,0,70C0,30,33.4,0,73,0c15.2,0,33,4.6,44.6,10.4V42C103,32.4,88.2,27,74.8,27z"></path>
                <path fill="#e3262d" d="M201.6,140c-39.8,0-73.4-31-73.4-70c0-39.4,33.4-70,75.2-70c15.2,0,34,4,45.6,9.4v31.4
      C235.8,33.2,218.8,27,204,27c-27.4,0-45.2,21.4-45.2,43c0,25.4,21,43.8,45.6,43.8c5.2,0,10.2-0.4,16.6-2.8V85.8h-22.4V59.2h51.2
      V130C235.2,136.6,218.8,140,201.6,140z"></path>
                <path fill="#e3262d" d="M272.1,137.2V2.8h28.8v134.4L272.1,137.2L272.1,137.2z"></path>
              </g>
            </g>
          </svg>
        </div>
        <div class="topbar__copy">
          <div class="topbar__namewrap">
            <h1 class="topbar__name">worktrace</h1>
            <p id="weekLabel">Loading</p>
          </div>
        </div>
      </div>
      <div class="topbar__actions">
        <div class="export-actions" aria-label="Export current week">
          <span>Export</span>
          <button class="ghost-button export-button" data-format="txt" type="button" title="Export current week as plain text">TXT</button>
          <button class="ghost-button export-button" data-format="csv" type="button" title="Export current week as CSV">CSV</button>
          <button class="ghost-button export-button" data-format="pdf" type="button" title="Export current week as PDF">PDF</button>
        </div>
        <button class="theme-button" id="themeButton" type="button" title="Switch theme">Dark</button>
        <div class="window-controls" aria-label="Window controls">
          <button class="window-controls__button" data-window-action="minimize" type="button" title="Minimize">_</button>
          <button class="window-controls__button" data-window-action="maximize" type="button" title="Maximize">▢</button>
          <button class="window-controls__button is-close" data-window-action="close" type="button" title="Close">×</button>
        </div>
      </div>
    </header>

    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <p>Workspace</p>
        </div>

        <div class="sidebar-actions">
          <button class="ghost-button" id="refreshButton" type="button" title="Refresh logs">Refresh</button>
        </div>

        <div class="stats">
          <div class="stat">
            <span class="stat__value" id="weekCount">0</span>
            <span class="stat__label">Week</span>
          </div>
          <div class="stat">
            <span class="stat__value" id="todayCount">0</span>
            <span class="stat__label">Today</span>
          </div>
        </div>

        <nav class="tabs" aria-label="Views">
          <button class="tab is-active" data-view="week" type="button">Week</button>
          <button class="tab" data-view="today" type="button">Today</button>
          <button class="tab" data-view="diagram" type="button">Diagram</button>
          <button class="tab" data-view="edit" type="button">Edit</button>
        </nav>

        <details class="accordion">
          <summary class="accordion__summary">
            <span>View week</span>
            <span class="accordion__hint">Week and range filters</span>
          </summary>
          <section class="panel panel--compact" aria-label="Date filters">
            <form class="filter-form" id="weekFilterForm">
              <label class="field">
                <span>Week reference</span>
                <select id="weekRefInput" name="weekRef"></select>
              </label>
              <div class="field-row">
                <label class="field">
                  <span>From</span>
                  <input id="rangeStartInput" name="rangeStart" type="date">
                </label>
                <label class="field">
                  <span>To</span>
                  <input id="rangeEndInput" name="rangeEnd" type="date">
                </label>
              </div>
              <div class="panel-actions">
                <button class="ghost-button" id="applyWeekFilterButton" type="submit">Apply</button>
                <button class="ghost-button" id="clearWeekFilterButton" type="button">Clear</button>
              </div>
              <p class="filter-summary" id="filterSummary">Showing the selected week.</p>
            </form>
          </section>
        </details>

        <div class="log-location">
          <span>Log directory</span>
          <button id="openLogDirButton" type="button" title="Open log directory">Open</button>
        </div>
        <p class="path" id="logDir">-</p>
      </aside>

      <main class="workspace">
        <div class="workspace-title">
          <div class="workspace-title__copy">
            <p class="eyebrow">worktrace</p>
            <h2 id="viewTitle">This week</h2>
          </div>
          <button id="entrySubmitButton" class="hero-button" type="submit" form="entryForm">+ Add</button>
        </div>

        <form class="entry-form" id="entryForm">
          <input id="entryDateInput" name="entryDate" autocomplete="off" type="date" aria-label="Log date">
          <input id="entryTimeInput" name="entryTime" autocomplete="off" type="time" aria-label="Log time">
          <input id="timeSpentInput" name="timeSpent" autocomplete="off" maxlength="60" placeholder="Time spent" aria-label="Time spent">
          <input id="entryInput" name="entry" autocomplete="off" maxlength="240" placeholder="Add activity text to log" aria-label="Log entry">
          <input id="projectInput" name="project" autocomplete="off" maxlength="120" placeholder="Task project" aria-label="Task project">
          <input id="referenceInput" name="reference" autocomplete="off" maxlength="180" placeholder="Ticket or link" aria-label="Ticket number or link">
        </form>

        <p class="status" id="status" role="status"></p>

        <section class="view is-active" id="weekView" aria-labelledby="viewTitle">
          <div class="section-heading">
            <h3>Filtered log</h3>
            <span id="weekFile">-</span>
          </div>
          <div class="entries" id="weekEntries"></div>
          <div class="list-actions">
            <button class="ghost-button" id="copyWeekButton" type="button">Copy to clipboard</button>
          </div>
        </section>

        <section class="view" id="todayView" aria-labelledby="viewTitle">
          <div class="section-heading">
            <h3>Today</h3>
            <span id="todayDate">-</span>
          </div>
          <div class="entries" id="todayEntries"></div>
        </section>

        <section class="view" id="diagramView" aria-labelledby="viewTitle">
          <div class="section-heading">
            <h3>Activity diagram</h3>
            <span id="diagramSummary">-</span>
          </div>
          <div class="diagram" id="diagramPanel"></div>
        </section>

        <section class="view" id="editView" aria-labelledby="viewTitle">
          <div class="section-heading">
            <h3>Raw weekly file</h3>
            <button class="save-button" id="saveWeekButton" type="button">Save</button>
          </div>
          <label class="sr-only" for="weekEditor">Raw weekly file content</label>
          <textarea id="weekEditor" spellcheck="false"></textarea>
        </section>
      </main>
    </div>

    <script src="./renderer.cjs"></script>
  </body>
</html>
